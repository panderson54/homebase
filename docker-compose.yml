services:
  homebase:
    build: .
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - HOMEBASE_ALLOWED_EMAILS=${HOMEBASE_ALLOWED_EMAILS}
      - HOMEBASE_MCP_TOKENS=${HOMEBASE_MCP_TOKENS}
