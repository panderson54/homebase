{% extends 'base.html' %}
{% block title %}Access denied — Homebase{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 text-center">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="48" height="48">
    <h1 class="h3 mt-2">Access denied</h1>
    <p class="text-muted">This Google account isn't allowed to use Homebase.</p>
    <a href="{{ url_for('main.google_login') }}" class="btn btn-outline-primary">Sign in with a different account</a>
  </div>
</div>
{% endblock %}
